# nginx in front of the app when Cloudflare is in front of nginx (browser -> Cloudflare -> nginx -> app).
#
# Without this, X-Forwarded-For reaching the app is "<visitor>, <Cloudflare address>", and with the default TRUSTED_PROXY_COUNT=1
# the app takes the LAST entry: Cloudflare's address, which differs from request to request and is shared by many people.
# Then IP-bound sessions end at random, and per-address limits and blocks hit everybody at once.
#
# Here nginx learns the visitor's address from Cloudflare (CF-Connecting-IP) - but only from requests that really come from
# Cloudflare's addresses - and passes exactly that one address on. TRUSTED_PROXY_COUNT=1 (the default) is then right.
#
# 1) Put the Cloudflare address ranges into /etc/nginx/cloudflare-ips.conf (see deploy/update-cloudflare-ips.sh; they change
#    now and then, so run it from cron / a timer every week or so).
# 2) In nginx.conf (http {} level) or in the server {} of the app:
include /etc/nginx/cloudflare-ips.conf;   # lines of:  set_real_ip_from <range>;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# 3) In the location that proxies the app (and /collab/): send ONE address, never the visitor's own X-Forwarded-For
#    (a visitor can write anything there). $remote_addr is the visitor's address after the lines above.
#
#    location / {
#        proxy_pass http://127.0.0.1:3000;
#        proxy_set_header Host $host;
#        proxy_set_header X-Real-IP $remote_addr;
#        proxy_set_header X-Forwarded-For $remote_addr;      # NOT $proxy_add_x_forwarded_for
#        proxy_set_header X-Forwarded-Proto https;
#    }
#
# 4) Close the side door: let only Cloudflare reach nginx on 80/443 (firewall: allow Cloudflare's ranges, deny the rest).
#    Otherwise somebody can call your server directly and write CF-Connecting-IP themselves - nginx ignores that header
#    unless the request comes from a Cloudflare address (3rd line above), but a direct caller should not get in at all.
#
# With a Cloudflare Tunnel (cloudflared on the same machine, no nginx): nothing of this is needed; TRUSTED_PROXY_COUNT=1.
