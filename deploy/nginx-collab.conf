# nginx reverse-proxy snippet: terminate TLS and forward /collab/ to the
# y-websocket collab server (WebSocket upgrade). Add inside the HTTPS server {}
# block for your app's domain, alongside the location that proxies the Next.js app.
#
# Client config: NEXT_PUBLIC_COLLAB_WS_URL="wss://mail.example.com/collab"
# (ComposeForm connects to  wss://mail.example.com/collab/webmail-draft-<id>)
#
# The trailing slash on proxy_pass strips the /collab/ prefix, so the room name
# the server sees is "webmail-draft-<id>" — matching the client room id.
#
# Cookies: the WS handshake is same-origin (same domain as the app), so the
# httpOnly `sid` session cookie is sent automatically and the collab server can
# authenticate it. No extra cookie handling needed.

location /collab/ {
    proxy_pass http://127.0.0.1:1234/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket connections are long-lived; don't time them out.
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
