# The database for development on your own computer. `npm run dev` / `npm run seed:demo` start it and
# stop it again when they end (scripts/with-db.mjs), so you normally never type a docker command.
# Its own project and volume: it does not touch the production stack of docker-compose.yml.
# User / password / database name / port come from DATABASE_URL in .env.
name: webmail-dev
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DEV_DB_USER:-webmail}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-webmail}
      POSTGRES_DB: ${DEV_DB_NAME:-webmail_app}
      POSTGRES_HOST_AUTH_METHOD: ${DEV_DB_AUTH:-scram-sha-256}
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"   # this computer only
    volumes:
      - devdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  devdata:
